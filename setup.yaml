      - "(ts:TrainService:serviceid)-[:STOPS_AT]->()::ts.serviceid=>ts"
      - "()-[t:STOPS_AT:stopid]->()::t.stopid=>t"
      - "()-[t:STOPS_AT:departure&stopid]->(s)::t.stopid=>s"
