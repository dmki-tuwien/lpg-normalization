services:
  neo4j:
    image: neo4j:2026.01-enterprise
    command: 'bash -c "cp -R /tmp/graphs /var/lib/neo4j/import && chown -R 7474:7474 /var/lib/neo4j/import && exec /startup/docker-entrypoint.sh neo4j"'
    environment:
       NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
       NEO4J_AUTH: ${USERNAME}/${PASSWORD}
       NEO4J_PLUGINS: '["apoc","apoc-extended"]'
       NEO4J_apoc_import_file_enabled: true
       NEO4J_dbms_security_procedures_unrestricted: "apoc.*"

    ports:
      - "7687:7687"  # Bolt
    networks:
      - app-network
    volumes:
      - ./graphs:/tmp/graphs
    profiles:
      - rest

  memgraph:
    image: memgraph/memgraph-mage:latest
    ports:
      - "7688:7687"
      - "7444:7444"
    command: ["--storage-properties-on-edges=true", "--log-level=TRACE", "--telemetry-enabled=false"]
    volumes:
      - ./graphs:/graphs
    healthcheck:
      test: [ "CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 0s
    networks:
      - app-network
    profiles:
      - rest
      - eval

  memgraph-lab:
    image: memgraph/lab:latest
    ports:
      - "3000:3000"
    depends_on:
      memgraph:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    profiles:
      - docs

  global-lpg-norm:
    build:
      context: .
      dockerfile: eval.Dockerfile
    container_name: global-lpg-norm
    depends_on:
      memgraph:
        condition: service_healthy

    env_file:
      - .env
    volumes:
      - ./graphs:/graphs
      - ./setup.yaml:/setup.yaml
      - ./out:/out
      - /var/run/docker.sock:/var/run/docker.sock # needed to spin up further containers using Python!
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TC_HOST=host.docker.internal
    networks:
      - app-network
    profiles:
      - eval

  docs-webserver:
    image: nginx:latest
    volumes:
      - ./docs/_build/html:/usr/share/nginx/html:ro
    ports:
      - "8000:80"
    profiles:
      - docs
  restapi:
    build:
      context: .
      dockerfile: ./restapi/restapi.Dockerfile
    env_file:
      - .env
    environment:
      - TC_HOST=host.docker.internal
    profiles:
      - rest
    networks:
      - app-network
    volumes:
      - ./setup.yaml:/app/setup.yaml
      - ./graphs:/app/graphs



volumes:
  neo4j_data:
  neo4j_logs:

networks:
  app-network:
    driver: bridge